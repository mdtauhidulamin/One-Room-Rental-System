<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Owner Account</title><link rel="stylesheet" href="style.css"></head><body class="login-body"><div class="login-card"><h1 data-i18n="ownerLogin">Owner Login</h1><p>Create owner account or login.</p><input id="ownerName" placeholder="Owner Full Name"><input id="ownerEmail" placeholder="Owner Email"><input id="ownerPhone" placeholder="Owner Phone"><input id="ownerPassword" type="password" placeholder="Password"><button onclick="createOwner()">Create Owner Account</button><button onclick="loginOwner()" class="secondary-btn">Login</button><a href="index.html">Back to Home</a><p id="message"></p></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="app.js"></script><script>async function createOwner(){if(!db)return warnConfig();let name=ownerName.value.trim(),email=ownerEmail.value.trim().toLowerCase(),phone=ownerPhone.value.trim(),password=ownerPassword.value.trim();if(!name||!email||!phone||!password){message.textContent='Fill all fields';return}if(await docGet('owners',email)){message.textContent='Email already exists';return}let o={name,email,phone,password};await docSet('owners',email,o);setCurrentOwner(o);location.href='owner-dashboard.html'}async function loginOwner(){if(!db)return warnConfig();let email=ownerEmail.value.trim().toLowerCase(),password=ownerPassword.value.trim();let o=await docGet('owners',email);if(!o||o.password!==password){message.textContent='Invalid login';return}setCurrentOwner(o);location.href='owner-dashboard.html'}</script></body></html>
