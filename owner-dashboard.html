<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Owner Dashboard</title><link rel="stylesheet" href="style.css"></head><body><nav class="navbar"><div class="logo"><img class="site-logo" src="assets/logo.svg"><strong class="site-name">Room Rental System</strong></div><div class="nav-links"><a href="index.html" data-i18n="home">Home</a><a href="index.html#rooms" data-i18n="rooms">Rooms</a><a href="index.html#about" data-i18n="about">About</a><a href="index.html#team" data-i18n="team">Our Team</a><span id="userNavArea"></span><span id="ownerNavArea"></span><span id="adminNavArea"></span><div class="language-dropdown"><button class="lang-globe" type="button">🌐</button><div class="language-menu"><button onclick="setLanguage('en')" type="button">English</button><button onclick="setLanguage('ko')" type="button">한국어</button></div></div></div></nav><section class="section"><h2 data-i18n="addRoom">Add New Building / Room</h2><div class="form-card"><input id="roomName" placeholder="Building / Room Name"><select id="roomType"><option>One Room / 원룸</option><option>Two Room / 투룸</option><option>Family Room / 패밀리룸</option><option>Apartment / 아파트</option></select><input id="rent" placeholder="Rent amount"><input id="address" placeholder="Address"><input id="phone" placeholder="Phone number"><select id="availability"><option value="true">Available</option><option value="false">Not Available</option></select><textarea id="description" placeholder="Description"></textarea><input id="imageInput" type="file" accept="image/*"><img id="preview" class="preview-img" src="assets/placeholder.svg"><button onclick="addRoom()">Add Room</button><p id="formMessage"></p></div></section><section class="section"><h2 data-i18n="myRooms">My Rooms</h2><div id="ownerRooms" class="dashboard-list"></div></section><section class="section"><h2 data-i18n="requestsForMyRooms">Requests for My Rooms</h2><div id="requestBox" class="dashboard-list"></div></section><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="app.js"></script><script>let owner=currentOwner();if(!owner)location.href='owner-login.html';let uploadedImage=PLACEHOLDER;imageInput.addEventListener('change',()=>toDataURL(imageInput,d=>{if(d){uploadedImage=d;preview.src=d}}));async function addRoom(){if(!roomName.value||!rent.value||!address.value||!phone.value){formMessage.textContent='Fill all fields';return}await addDoc('rooms',{ownerEmail:owner.email,ownerName:owner.name,name:roomName.value,type:roomType.value,rent:rent.value,address:address.value,phone:phone.value,description:description.value,available:availability.value==='true',image:uploadedImage});formMessage.textContent='Room added';roomName.value=rent.value=address.value=phone.value=description.value='';uploadedImage=PLACEHOLDER;preview.src=PLACEHOLDER}listenCol('rooms',rooms=>{let mine=rooms.filter(r=>r.ownerEmail===owner.email);ownerRooms.innerHTML=mine.length?mine.map(r=>`<div class="dash-card"><img class="preview-img" src="${r.image||PLACEHOLDER}"><span class="${r.available?'status available':'status not-available'}">${r.available?t('available'):t('notAvailable')}</span><h3>${escapeHtml(r.name)}</h3><p>${escapeHtml(r.rent)}</p><button class="success-btn" onclick="docSet('rooms','${r.id}',{available:true})">Available</button><button class="danger-btn" onclick="docSet('rooms','${r.id}',{available:false})">Not Available</button><button class="secondary-btn" onclick="delDoc('rooms','${r.id}')">Delete</button></div>`).join(''):'<p>No rooms.</p>'});listenCol('requests',reqs=>{let mine=reqs.filter(r=>r.ownerEmail===owner.email);requestBox.innerHTML=mine.length?mine.map(r=>`<div class="dash-card"><span class="status ${r.status.toLowerCase()}">${r.status}</span><h3>${escapeHtml(r.roomName)}</h3><p>${escapeHtml(r.userName)} - ${escapeHtml(r.userEmail)}</p><button class="success-btn" onclick="docSet('requests','${r.id}',{status:'Accepted'})">Accept</button><button class="danger-btn" onclick="docSet('requests','${r.id}',{status:'Denied'})">Deny</button></div>`).join(''):'<p>No requests.</p>'})</script></body></html>
