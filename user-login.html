<!DOCTYPE html><html><head><meta charset="UTF-8"><title>User Account</title><link rel="stylesheet" href="style.css"></head><body class="login-body"><div class="login-card"><h1 data-i18n="userLogin">User Login</h1><p>Create account or login.</p><input id="userName" placeholder="Full Name"><input id="userEmail" placeholder="Email"><input id="userPhone" placeholder="Phone Number"><input id="userPassword" type="password" placeholder="Password"><button onclick="createUser()">Create User Account</button><button onclick="loginUser()" class="secondary-btn">Login</button><a href="index.html">Back to Home</a><p id="message"></p></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="app.js"></script><script>async function createUser(){if(!db)return warnConfig();let name=userName.value.trim(),email=userEmail.value.trim().toLowerCase(),phone=userPhone.value.trim(),password=userPassword.value.trim();if(!name||!email||!phone||!password){message.textContent='Fill all fields';return}if(await docGet('users',email)){message.textContent='Email already exists';return}let u={name,email,phone,password};await docSet('users',email,u);setCurrentUser(u);location.href='index.html'}async function loginUser(){if(!db)return warnConfig();let email=userEmail.value.trim().toLowerCase(),password=userPassword.value.trim();let u=await docGet('users',email);if(!u||u.password!==password){message.textContent='Invalid login';return}setCurrentUser(u);location.href='index.html'}</script></body></html>
