<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Owner Profile</title><link rel="stylesheet" href="style.css"></head><body><nav class="navbar"><div class="logo"><img class="site-logo" src="assets/logo.svg"><strong class="site-name">Room Rental System</strong></div><div class="nav-links"><a href="index.html" data-i18n="home">Home</a><a href="index.html#rooms" data-i18n="rooms">Rooms</a><a href="index.html#about" data-i18n="about">About</a><a href="index.html#team" data-i18n="team">Our Team</a><span id="userNavArea"></span><span id="ownerNavArea"></span><span id="adminNavArea"></span><div class="language-dropdown"><button class="lang-globe" type="button">🌐</button><div class="language-menu"><button onclick="setLanguage('en')" type="button">English</button><button onclick="setLanguage('ko')" type="button">한국어</button></div></div></div></nav><section class="section"><h2 data-i18n="myOwnerProfile">My Owner Profile</h2><div class="form-card"><input id="oName"><input id="oEmail" disabled><input id="oPhone"><input id="oPass" type="password"><button onclick="updateOwner()">Update Owner Profile</button><p id="msg"></p></div></section><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="app.js"></script><script>let o=currentOwner();if(!o)location.href='owner-login.html';oName.value=o.name;oEmail.value=o.email;oPhone.value=o.phone;oPass.value=o.password;async function updateOwner(){o={...o,name:oName.value,phone:oPhone.value,password:oPass.value};await docSet('owners',o.email,o);setCurrentOwner(o);msg.textContent='Updated';updateNavbar()}</script></body></html>
