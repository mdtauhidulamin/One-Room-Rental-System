<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Admin Dashboard</title><link rel="stylesheet" href="style.css"></head><body><nav class="navbar"><div class="logo"><img class="site-logo" src="assets/logo.svg"><strong class="site-name">Room Rental System</strong></div><div class="nav-links"><a href="index.html" data-i18n="home">Home</a><a href="index.html#rooms" data-i18n="rooms">Rooms</a><a href="index.html#about" data-i18n="about">About</a><a href="index.html#team" data-i18n="team">Our Team</a><span id="userNavArea"></span><span id="ownerNavArea"></span><span id="adminNavArea"></span><div class="language-dropdown"><button class="lang-globe" type="button">🌐</button><div class="language-menu"><button onclick="setLanguage('en')" type="button">English</button><button onclick="setLanguage('ko')" type="button">한국어</button></div></div></div></nav><section class="section"><h2 data-i18n="adminControlPanel">Admin Control Panel</h2><div class="admin-grid"><div class="admin-card"><h3 data-i18n="websiteSettings">Website Settings</h3><input id="websiteName" placeholder="Website Name"><input id="heroTitleInput" placeholder="Hero Title"><textarea id="heroSubtitleInput" placeholder="Hero Subtitle"></textarea><textarea id="aboutInput" placeholder="About Text"></textarea><input id="teamTitleInput" placeholder="Team Title"><textarea id="teamSubtitleInput" placeholder="Team Subtitle"></textarea><button onclick="saveTextSettings()">Save Text Settings</button></div><div class="admin-card"><h3 data-i18n="logoBackground">Logo & Background</h3><input id="logoUpload" type="file" accept="image/*"><img id="logoPreview" class="preview-img" src="assets/logo.svg"><input id="bgUpload" type="file" accept="image/*"><img id="bgPreview" class="preview-img" src="assets/placeholder.svg"><button onclick="saveImageSettings()">Save Images</button></div></div></section><section class="section"><h2 data-i18n="teamMembers">Team Members</h2><div class="admin-card"><input id="teamName" placeholder="Member Name"><input id="teamRole" placeholder="Role"><textarea id="teamDetails" placeholder="Details"></textarea><input id="teamPhotoInput" type="file" accept="image/*"><img id="teamPhotoPreview" class="preview-img" src="assets/placeholder.svg"><button onclick="addTeamMember()">Add Member</button></div><div id="teamAdminBox"></div></section><section class="section"><h2 data-i18n="userAccounts">User Accounts</h2><div id="usersBox"></div></section><section class="section"><h2 data-i18n="ownerAccounts">Owner Accounts</h2><div id="ownersBox"></div></section><section class="section"><h2 data-i18n="allRoomsTitle">All Rooms</h2><div id="roomsBox"></div></section><section class="section"><h2 data-i18n="allRentRequests">All Rent Requests</h2><div id="requestsBox"></div></section><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="app.js"></script><script>if(!currentAdmin())location.href='admin-login.html';let logoData=null,bgData=null,teamPhotoData=PLACEHOLDER;listenDoc('settings','site',s=>{let v={...DEFAULT_SITE,...(s||{})};websiteName.value=v.websiteName;heroTitleInput.value=v.heroTitle;heroSubtitleInput.value=v.heroSubtitle;aboutInput.value=v.aboutText;teamTitleInput.value=v.teamTitle;teamSubtitleInput.value=v.teamSubtitle;logoPreview.src=v.logo;bgPreview.src=v.background});logoUpload.addEventListener('change',()=>toDataURL(logoUpload,d=>{logoData=d;logoPreview.src=d}));bgUpload.addEventListener('change',()=>toDataURL(bgUpload,d=>{bgData=d;bgPreview.src=d}));teamPhotoInput.addEventListener('change',()=>toDataURL(teamPhotoInput,d=>{teamPhotoData=d;teamPhotoPreview.src=d}));async function saveTextSettings(){await docSet('settings','site',{websiteName:websiteName.value,heroTitle:heroTitleInput.value,heroSubtitle:heroSubtitleInput.value,aboutText:aboutInput.value,teamTitle:teamTitleInput.value,teamSubtitle:teamSubtitleInput.value})}async function saveImageSettings(){let d={};if(logoData)d.logo=logoData;if(bgData)d.background=bgData;await docSet('settings','site',d)}async function addTeamMember(){await addDoc('team',{name:teamName.value,role:teamRole.value,details:teamDetails.value,photo:teamPhotoData});teamName.value=teamRole.value=teamDetails.value='';teamPhotoData=PLACEHOLDER;teamPhotoPreview.src=PLACEHOLDER}function table(rows,heads,mapper){return rows.length?`<table class="admin-table"><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(mapper).join('')}</table>`:'<p>No data.</p>'}listenCol('team',x=>teamAdminBox.innerHTML=table(x,['Photo','Name','Role','Details','Action'],m=>`<tr><td><img class="admin-mini-img" src="${m.photo||PLACEHOLDER}"></td><td>${escapeHtml(m.name)}</td><td>${escapeHtml(m.role)}</td><td>${escapeHtml(m.details)}</td><td><button class="danger-btn" onclick="delDoc('team','${m.id}')">Delete</button></td></tr>`));listenCol('users',x=>usersBox.innerHTML=table(x,['Name','Email','Phone','Action'],u=>`<tr><td>${escapeHtml(u.name)}</td><td>${escapeHtml(u.email)}</td><td>${escapeHtml(u.phone)}</td><td><button class="danger-btn" onclick="delDoc('users','${u.email}')">Delete</button></td></tr>`));listenCol('owners',x=>ownersBox.innerHTML=table(x,['Name','Email','Phone','Action'],o=>`<tr><td>${escapeHtml(o.name)}</td><td>${escapeHtml(o.email)}</td><td>${escapeHtml(o.phone)}</td><td><button class="danger-btn" onclick="delDoc('owners','${o.email}')">Delete</button></td></tr>`));listenCol('rooms',x=>roomsBox.innerHTML=table(x,['Photo','Room','Owner','Rent','Action'],r=>`<tr><td><img class="admin-mini-img" src="${r.image||PLACEHOLDER}"></td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.ownerName)}</td><td>${escapeHtml(r.rent)}</td><td><button class="danger-btn" onclick="delDoc('rooms','${r.id}')">Delete</button></td></tr>`));listenCol('requests',x=>requestsBox.innerHTML=table(x,['Room','User','Owner','Status','Date'],r=>`<tr><td>${escapeHtml(r.roomName)}</td><td>${escapeHtml(r.userName)}<br>${escapeHtml(r.userEmail)}</td><td>${escapeHtml(r.ownerName)}<br>${escapeHtml(r.ownerEmail)}</td><td>${escapeHtml(r.status)}</td><td>${escapeHtml(r.date)}</td></tr>`));</script></body></html>
