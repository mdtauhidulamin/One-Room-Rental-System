<!DOCTYPE html><html><head><meta charset="UTF-8"><title>User Profile</title><link rel="stylesheet" href="style.css"></head><body><nav class="navbar"><div class="logo"><img class="site-logo" src="assets/logo.svg"><strong class="site-name">Room Rental System</strong></div><div class="nav-links"><a href="index.html" data-i18n="home">Home</a><a href="index.html#rooms" data-i18n="rooms">Rooms</a><a href="index.html#about" data-i18n="about">About</a><a href="index.html#team" data-i18n="team">Our Team</a><span id="userNavArea"></span><span id="ownerNavArea"></span><span id="adminNavArea"></span><div class="language-dropdown"><button class="lang-globe" type="button">🌐</button><div class="language-menu"><button onclick="setLanguage('en')" type="button">English</button><button onclick="setLanguage('ko')" type="button">한국어</button></div></div></div></nav><section class="section"><h2 data-i18n="myProfile">My Profile</h2><div class="form-card"><input id="pName"><input id="pEmail" disabled><input id="pPhone"><input id="pPass" type="password"><button onclick="updateProfile()">Update Profile</button><p id="msg"></p></div></section><section class="section"><h2>My Rent Requests</h2><div id="reqBox" class="dashboard-list"></div></section><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="app.js"></script><script>let u=currentUser();if(!u)location.href='user-login.html';pName.value=u.name;pEmail.value=u.email;pPhone.value=u.phone;pPass.value=u.password;async function updateProfile(){u={...u,name:pName.value,phone:pPhone.value,password:pPass.value};await docSet('users',u.email,u);setCurrentUser(u);msg.textContent='Updated';updateNavbar()}listenCol('requests',rs=>{let mine=rs.filter(r=>r.userEmail===u.email);reqBox.innerHTML=mine.length?mine.map(r=>`<div class="dash-card"><span class="status ${r.status.toLowerCase()}">${r.status}</span><h3>${escapeHtml(r.roomName)}</h3><p>${escapeHtml(r.ownerName)} - ${escapeHtml(r.date)}</p></div>`).join(''):'<p>No request sent yet.</p>'})</script></body></html>
